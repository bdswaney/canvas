root = "."
tmp_dir = ".tmp"

[build]
# Rebuild Vite before Go embeds dist/. Generated output is excluded below.
# insecurecookie is a development-only build tag: without it the session
# cookies are marked Secure and a plain-http localhost login cannot work.
cmd = "npm run build && go build -tags insecurecookie -o ./.tmp/canvas ."
entrypoint = ["./.tmp/canvas"]
# Development is explicit at runtime; insecurecookie only controls the
# cookie Secure attribute for plain-http localhost.
full_bin = "CANVAS_ENV=development ./.tmp/canvas"
delay = 500
include_ext = ["go", "mod", "sum", "ts", "tsx", "js", "jsx", "json", "html", "css"]
exclude_dir = [".git", ".tmp", "bin", "dist", "node_modules", "docs", "vendor"]
stop_on_error = true
send_interrupt = true
kill_delay = "1s"

[log]
time = true

[misc]
clean_on_exit = true
