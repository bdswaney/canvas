[tools]
go = "1.27.1"
node = "24.20.0"
air = "1.67.4"
rust = "1.98.1"

[tasks.deps]
description = "Install locked frontend dependencies"
run = "npm ci"

[tasks.dev]
description = "Start the frontend development server"
run = "npm run dev"

[tasks.typecheck]
description = "Type-check the frontend"
run = "npm run typecheck"

[tasks.build]
description = "Type-check and build the frontend"
run = "npm run build"

[tasks.serve]
description = "Watch sources, rebuild the frontend, and restart Go with Air"
run = "air -c .air.toml"

[tasks."build:ydoc"]
description = "Compile the Yjs engine to WebAssembly"
# The result is committed, so a build or a test run needs no Rust toolchain.
# Run this after changing anything under internal/ydoc/shim.
run = """
cd internal/ydoc/shim && cargo build --release
cp target/wasm32-wasip1/release/canvas_ydoc.wasm ../ydoc.wasm
"""

[tasks."build:server"]
description = "Build a standalone Go binary with the frontend embedded"
depends = ["build"]
run = "go build -o bin/canvas ."

[tasks.test]
description = "Build the frontend and run Go tests"
depends = ["build"]
run = "go test ./..."

[tasks.preview]
description = "Preview the built frontend locally"
run = "npm run preview"

[tasks.doctor]
description = "Check the project toolchain"
run = """
go version
node --version
npm --version
air -v
"""

[tasks.db]
description = "Start a local Postgres container for development"
run = """
docker start canvas-postgres 2>/dev/null || docker run --detach --name canvas-postgres \
  --publish 127.0.0.1:5432:5432 \
  --env POSTGRES_USER=canvas --env POSTGRES_PASSWORD=canvas --env POSTGRES_DB=canvas \
  postgres:18-alpine
"""

[tasks."db:stop"]
description = "Stop the local Postgres container"
run = "docker stop canvas-postgres"

[tasks.tunnel]
description = "Expose the local server through an ngrok tunnel"
run = "ngrok http ${PORT:-8080}"

[tasks.migrate]
description = "Apply database migrations"
run = "go run . migrate"

[tasks.createuser]
description = "Create a login (usage: mise run createuser <username> <password>)"
run = "go run . createuser"

[tasks.deleteuser]
description = "Delete a login (usage: mise run deleteuser <username>)"
run = "go run . deleteuser"

[tasks.token]
description = "Manage access tokens (usage: mise run token create <username> <name>)"
run = "go run . token"

[tasks.mcp]
description = "Serve Canvas over MCP on stdio (usage: mise run mcp <username>)"
run = "go run . mcp"

[tasks."dev:server"]
description = "Build and run the server for local http development"
depends = ["build"]
# A separate binary from build:server, whose output keeps secure cookies.
run = "go build -tags insecurecookie -o bin/canvas-dev . && ./bin/canvas-dev"
