[package]
name = "canvas-ydoc"
version = "0.1.0"
edition = "2021"
publish = false

# yrs is the Yjs organisation's Rust port. The Go server drives it through the
# flat WASM interface in src/lib.rs; nothing here is called from Rust.
[dependencies]
yrs = "0.18"
# Myers diff for canvas_set_text. Only the slice algorithms are used, so the
# text helpers stay out.
similar = { version = "3.2", default-features = false, features = ["std"] }

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
